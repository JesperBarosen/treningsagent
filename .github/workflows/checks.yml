# The checks from CLAUDE.md on every pull request (#112): backend pytest and
# frontend lint, type check and tests. No secrets, and nothing calls Claude.
# The database tests (tests/test_db*.py) skip in the backend job and run in the
# database job, against a local Supabase database built from
# supabase/migrations/ in the runner (#163). Nothing connects to production.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Not a secret and never contacted: the auth dependency only needs a URL to
      # build its key client, and the tests that use it send no token (401).
      SUPABASE_URL: http://localhost:54321
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (Python from backend/.python-version)
        run: uv sync --locked
      - name: Tests
        run: uv run python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: http://localhost:54321
      # The local database in this runner, with the CLI's fixed local password.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start the database and apply every migration from scratch
        working-directory: .
        run: supabase db start
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (Python from backend/.python-version)
        run: uv sync --locked
      - name: Database tests (none may skip)
        # shell: bash adds pipefail, so a failing pytest fails the step despite tee.
        shell: bash
        run: |
          uv run python -m pytest -q -rs tests/test_db*.py | tee pytest.out
          if grep -q skipped pytest.out; then echo "::error::database tests were skipped"; exit 1; fi
      - name: Stop the database
        if: always()
        working-directory: .
        run: supabase stop --no-backup
