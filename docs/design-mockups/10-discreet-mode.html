<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N7. Discreet mode</title>
<style>
  /* DESIGN.md tokens (frontend/app/globals.css). System fonts keep the file self-contained. */
  :root {
    --canvas: #f5f4ef; --surface: #ffffff; --sunken: #eceae3; --line: #d9d6cc;
    --ink: #15191b; --ink-muted: #5a6166; --accent: #0f6b5c; --on-accent: #ffffff;
    --accent-soft: #dcefea; --climb: #9a5a17; --climb-soft: #f6e8d6;
    --danger: #b42318; --danger-soft: #fdecea; --grade-ring: #857f72;
    --grade-yellow: #f2c230; --grade-green: #2e9e5b; --grade-blue: #2f6fd6;
    --grade-purple: #7c4dc4; --grade-red: #d63a3a; --grade-black: #1a1a1a; --grade-white: #ffffff;
    --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0e1214; --surface: #161b1e; --sunken: #1e2529; --line: #2c3439;
      --ink: #eceeec; --ink-muted: #9aa3a7; --accent: #4fd1b5; --on-accent: #062621;
      --accent-soft: #13312c; --climb: #e5a15a; --climb-soft: #33271a;
      --danger: #f97066; --danger-soft: #3a1c1a; --grade-ring: #6b767c;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--canvas); color: var(--ink); font: 16px/1.5 var(--font-sans); }
  header.page, .notes { max-width: 820px; margin: 0 auto 24px; }
  header.page h1 { font: 600 22px/28px var(--font-display); margin: 0 0 4px; }
  .lead { color: var(--ink-muted); font-size: 14px; margin: 0; }
  .pair { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; }
  figure { margin: 0; }
  figcaption { font: 600 12px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; }
  figcaption.after { color: var(--accent); }
  .phone { width: 375px; max-width: 100%; height: 720px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--canvas); display: flex; flex-direction: column; position: relative; }
  .top { height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .wordmark { font: 600 18px var(--font-display); }
  .wordmark b { color: var(--accent); font-weight: 600; }
  .icons { display: flex; gap: 0; }
  .icon { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-muted); }
  .hot { outline: 2px dashed var(--danger); outline-offset: -2px; border-radius: 12px; }
  .main { flex: 1; padding: 16px; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .h { font: 600 22px/28px var(--font-display); margin: 0; }
  .sub { font-size: 14px; color: var(--ink-muted); margin: -8px 0 0; }
  .card { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px; }
  .card h3 { font: 600 18px/24px var(--font-display); margin: 0; }
  .muted { color: var(--ink-muted); }
  .xs { font-size: 12px; } .sm { font-size: 14px; }
  .bubble { margin-left: auto; max-width: 85%; background: var(--sunken); border-radius: 18px 18px 8px 18px; padding: 10px 16px; width: fit-content; font-size: 15px; }
  .agent { font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  .badge { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); font-size: 14px; }
  .badge.climb { background: var(--climb-soft); color: var(--climb); }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .gchip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; background: var(--sunken); text-transform: capitalize; }
  .dot { width: 10px; height: 10px; border-radius: 999px; box-shadow: 0 0 0 1px var(--grade-ring); display: inline-block; flex: none; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { border: 1px solid var(--line); background: var(--canvas); border-radius: 12px; padding: 10px 12px; }
  .tile .v { font: 600 22px/28px var(--font-display); font-variant-numeric: tabular-nums; }
  .trend { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--sunken); color: var(--ink-muted); white-space: nowrap; }
  .trend.good { background: var(--accent-soft); color: var(--accent); }
  .bar { height: 8px; border-radius: 999px; background: var(--sunken); position: relative; }
  .bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
  .field { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; font-size: 15px; }
  .label { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .composer { flex: none; border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; align-items: center; background: var(--canvas); }
  .composer .input { flex: 1; min-height: 48px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 12px 16px; color: var(--ink-muted); font-size: 15px; }
  .send { width: 48px; height: 48px; border-radius: 999px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
  .shortcuts { flex: none; display: flex; gap: 8px; padding: 10px 16px 0; background: var(--canvas); border-top: 1px solid var(--line); }
  .shortcuts + .composer { border-top: 0; }
  .tabs { height: 60px; flex: none; border-top: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; }
  .tabs span { flex: 1; display: grid; place-items: center; font-size: 12px; color: var(--ink-muted); height: 100%; }
  .tabs span.on { color: var(--accent); font-weight: 600; }
  .tabs .fab { flex: none; width: 60px; height: 60px; margin: -24px 6px 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 -2px 12px rgb(0 0 0 / .15); }
  .banner { border-radius: 12px; background: var(--accent-soft); padding: 12px 14px; font-size: 14px; }
  .note { font-size: 12px; color: var(--ink-muted); }
  .flag { font-size: 12px; font-weight: 600; color: var(--danger); }
  .blur { filter: blur(6px); }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 999px; background: var(--sunken); font-size: 12px; font-weight: 600; color: var(--ink-muted); }
  .option { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 16px; min-height: 64px; }
  .option b { display: block; font-size: 16px; }
  .notes { font-size: 14px; color: var(--ink-muted); margin-top: 24px; }
  .notes a { color: var(--accent); }
</style>
</head>
<body>
<header class="page">
  <h1>N7. Discreet mode</h1>
  <p class="lead">Sessions at 375 px, opened on a bus. P15, P13 [Consolvo 2009].</p>
</header>
<div class="pair">
  <figure>
    <figcaption>Before</figcaption>
    <div class="phone" role="img" aria-label="Before: numbers and notes are readable to anyone nearby"><div class="top"><span class="wordmark">trening<b>s</b>agent</span><span class="icons "><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg></span><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/></svg></span><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h3.5A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H14"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg></span></span></div><div class="main">
    <p class="h">Sessions</p>
    <div class="card sm"><div class="row between"><b>Run</b><span class="xs muted">Today</span></div><div class="muted">9.2 km · 50 min · 5:26 /km · effort 7</div><div style="margin-top:6px">Knee pain again after 6 km, see physio?</div></div>
    <div class="card sm"><div class="row between"><b>Climbing</b><span class="xs muted">Wed 12 Nov</span></div><div class="muted">90 min · 3/4 sent · effort 7</div></div>
    <div class="card sm"><div class="row between"><b>Run</b><span class="xs muted">Mon 10 Nov</span></div><div class="muted">5 km · 31 min · 6:12 /km · effort 4</div></div>
  </div><div class="tabs"><span class="">Coach</span><span class="">Log</span><span class="on">Sessions</span><span class="">Dashboard</span></div></div>
  </figure>
  <figure>
    <figcaption class="after">After</figcaption>
    <div class="phone" role="img" aria-label="After: numbers and notes are blurred until tapped"><div class="top"><span class="wordmark">trening<b>s</b>agent</span><span class="icons "><span class="pill" style="margin-right:4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><path d="m3 3 18 18"/></svg> Discreet</span><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg></span><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3"/></svg></span><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h3.5A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H14"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg></span></span></div><div class="main">
    <p class="h">Sessions</p>
    <div class="card sm"><div class="row between"><b>Run</b><span class="xs muted">Today</span></div><div class="muted blur">9.2 km · 50 min · 5:26 /km · effort 7</div><div class="blur" style="margin-top:6px">Knee pain again after 6 km, see physio?</div></div>
    <div class="card sm"><div class="row between"><b>Climbing</b><span class="xs muted">Wed 12 Nov</span></div><div class="muted blur">90 min · 3/4 sent · effort 7</div></div>
    <div class="card sm"><div class="row between"><b>Run</b><span class="xs muted">Mon 10 Nov</span></div><div class="muted blur">5 km · 31 min · 6:12 /km · effort 4</div></div>
    <p class="note">Tap a row to reveal it. The "Discreet" pill shows the mode is on. It is visual only, and the toggle says so.</p>
  </div><div class="tabs"><span class="">Coach</span><span class="">Log</span><span class="on">Sessions</span><span class="">Dashboard</span></div></div>
  </figure>
</div>
<div class="notes">
  <p><strong>Change:</strong> a class on <code>&lt;html&gt;</code>, set like the theme, that blurs elements marked as sensitive on Coach, Sessions and Dashboard. Remembered per device.</p><p>See <a href="../design-proposals-2.md">design-proposals-2.md</a>, N7.</p>
</div>
</body>
</html>
