<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon "Fremgang" (progress): two upward chevrons, white and glacier teal (the
       climbing token), on glacier teal. They read as progress and as two peaks.
       Full bleed and kept inside the central 80% circle, so it also works as a maskable icon. -->
  <rect width="512" height="512" fill="#006E78"/>
  <polyline points="136,372 256,252 376,372" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="136,268 256,148 376,268" fill="none" stroke="#5FD4D6" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
