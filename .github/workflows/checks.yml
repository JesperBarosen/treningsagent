# The checks from CLAUDE.md on every pull request (#112): backend pytest and
# frontend lint, type check and tests. No secrets: tests that need a database
# (TEST_DATABASE_URL) skip, as they do locally, and nothing calls Claude.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Not a secret and never contacted: the auth dependency only needs a URL to
      # build its key client, and the tests that use it send no token (401).
      SUPABASE_URL: http://localhost:54321
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (Python from backend/.python-version)
        run: uv sync --locked
      - name: Tests
        run: uv run python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
